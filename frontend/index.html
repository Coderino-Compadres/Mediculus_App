<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <!-- The foundation's logo (src/assets/mediculus-logo.jpeg), resized into
         public/: .ico for the tab, PNG for browsers that prefer it, and the
         180px one iOS uses for a home-screen shortcut. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Dzienniczek emocji i żywienia, raporty tygodniowe i techniki terapeutyczne Fundacji Mediculus." />
    <!-- Installed-app chrome. theme-color is the manifest's, repeated because
         browsers read it from here before the manifest has loaded. The apple-*
         tags are for iOS, which ignores most of the manifest: without them a
         home-screen launch opens with Safari's bars and a truncated title. -->
    <meta name="theme-color" content="#f0edf6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mediculus" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Karla:wght@400;600&family=Lora:wght@600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Karla:wght@400;600&family=Lora:wght@600&display=swap"
      />
    </noscript>
    <title>Mediculus</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
